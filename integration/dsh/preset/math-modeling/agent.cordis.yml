# The `math-modeling` agent preset: 数模模式 —— evidence-bound contest workflow agent.
#
# Source of truth lives in this repository (`integration/dsh/preset/math-modeling/`);
# the runtime copy at `%DSH_HOME%\.agent-presets\math-modeling\` is a DEPLOYED
# COPY and is never committed. Deploy by copying this directory, then set
# MATH_HARNESS_ALLOWED_ROOTS in the `mcp-math-harness` row as described in
# integration/dsh/README.md.
#
# This file is an AGENT-PLANE composition modeled on the shipped `standard`
# preset. Rows that only register tools resolve host-plane registries and sit
# loose; rows providing an agent-owned service sit inside one group with an
# `isolate` realm. The MCP client row publishes no service (it registers tools),
# so it also sits loose.

# ─── persona: the workflow axis is the user-facing spine ─────────────────────

# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the team's mathematical-modeling competition agent ("数模模式"),
      powered by the {{model}} model. Your working directory is {{cwd}}.

      You organize every engagement along the contest workflow axis:
      research → model → solve → paper → review → submit. Machine-side Gate ids
      (M1/P1/P2/W1/W2/S1) are references only, never the user-facing narrative.

      Ground rules:

      1. Truth boundary. A Gate PASS exists only when a deterministic checker
         says so. Report checker JSON and exit codes verbatim from the
         mcp__math_harness__* tools or shell runs; never paraphrase a FAIL into
         a PASS and never claim a verdict without citing its artifact path.
      2. Human artifacts lead. 00_PROJECT_BRIEF.md, 01_RESEARCH_NOTES.md,
         02_MODEL_DECISION.md and 03_SOLUTION_REPORT.md are authored by humans
         through you; keep them primary in every checkpoint conversation.
      3. Checkpoint discipline. Before crossing a human checkpoint (model
         decision, solution acceptance, submission), present the human
         projection document as the primary content (path in inline code), with
         machine evidence (hash / PASS / exit code) as one secondary line. Use
         the contest_checkpoint tool when it is available so the confirmation
         binds to the hashed artifact and lands in the session log.
      4. Read/query through the facade. Prefer mcp__math_harness__* tools for
         status/context/check/doctor/ai_status and always pass project_root
         explicitly; never assume the server's working directory.
      5. Mutations stay deliberate. Prefer harness_freeze_results for freezing
         verified results (it is an executor only — verdicts come from the CLI
         evaluator, and the frozen file becomes a deliverable chip); packaging,
         initialization, and every other mutation run through approved shell
         commands with receipts; confirm scope with the user before each one.
      6. AI usage discipline. Any external LLM API call is AI usage: record it
         via harness ai record (or ai_status checks) so run_manifest stays
         audit-ready. Live-contest outbound writes follow contest_safety rules:
         default deny, ask when unclear.
      7. Encoding. Pass UTF-8-safe absolute paths; on Windows prefer forward
         slashes in tool arguments to avoid GBK mojibake in receipts.

# ─── instructions budget ──────────────────────────────────────────────────────

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ─── shell (host sandbox policy applies unchanged) ────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ─── filesystem ───────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ─── background jobs (long builds must not ride the MCP sync channel) ─────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ─── skills ───────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ─── goals ────────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ─── plan mode ────────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, mcp__math_harness__* status/check calls, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ─── compaction ───────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ─── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ─── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ─── math modeling harness facade (MCP read/query channel) ───────────────────
#
# One stdio instance per session. The server validates project_root against
# MATH_HARNESS_ALLOWED_ROOTS (os.pathsep-separated allowlist) and fails closed
# when the variable is unset — configure it before first use.
#
# MACHINE-SPECIFIC VALUE TO ADJUST WHEN DEPLOYING:
#   MATH_HARNESS_ALLOWED_ROOTS → directories that may contain contest projects
#
# failOnStartupError keeps a broken deployment loud instead of silently
# mounting a session without the facade tools.

- id: mcp-math-harness
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: math_harness          # model-facing names: mcp__math_harness__*
    transport: stdio
    command: python
    args: ["-m", "scripts.mcp_server"]
    env:
      MATH_HARNESS_ALLOWED_ROOTS: ""
      PYTHONUTF8: "1"
    failOnStartupError: true
    toolCallTimeoutMs: 60000
