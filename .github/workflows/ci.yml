name: harness-ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install editable CLI and check entry point
        run: |
          python -m pip install --no-deps -e .
          harness --help
      - name: Install TeX Live and poppler tools
        # safe_build.py drives latexmk+xelatex and check_pdf.py drives
        # pdfinfo/pdffonts/pdftoppm; none are preinstalled on ubuntu runners.
        # geometry.sty lives in texlive-latex-extra; fonts back the
        # embedded-fonts assertions in the PDF visual-QA test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-xetex \
            poppler-utils
      - name: Parse schemas
        run: python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('schemas').glob('*.schema.json')]; print('schema parse ok')"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Agent contract scope check
        run: python scripts/harness.py agents check
      - name: Red-team reliability evaluation
        run: python evaluation/redteam.py --output evaluation/results/redteam-latest.json
      - name: Skill metadata and progressive-disclosure validation
        # The bound exists so SKILL.md stays an entry file: detail belongs in the
        # routed references/, not in the front page an agent loads every run.
        # Raising it is a deliberate loosening, never a default.
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          text = Path("SKILL.md").read_text(encoding="utf-8")
          lines = len(text.splitlines())
          assert text.startswith("---"), "SKILL.md must open with frontmatter"
          yaml.safe_load(text.split("---", 2)[1])
          assert 150 <= lines <= 360, f"SKILL.md is {lines} lines; keep it an entry file, not a manual"
          print(f"skill validation ok ({lines} lines)")
          PY
