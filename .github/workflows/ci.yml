name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Schema sanity (all JSON schemas parse)
        run: python -c "import json,glob; [json.load(open(p, encoding='utf-8')) for p in glob.glob('schemas/*.json')]; print('schemas ok')"
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
