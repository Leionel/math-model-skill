[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-skill-sion"
version = "2.0.0"
description = "Evidence-bound math-modeling Harness"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "jsonschema>=4"]

[project.scripts]
harness = "scripts.harness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "schemas*", "references*", "competition_profiles*", "assets*"]
exclude = ["references.precedents.local-sources*", "assets.figure-gallery*"]
namespaces = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"schemas" = ["*.json"]
"competition_profiles" = ["*.yaml"]
"references" = ["router.md"]
"references.cards.failures" = ["*.md"]
"references.cards.methods" = ["*.md"]
"references.cards.problems" = ["*.md"]
"references.contracts" = ["*.md"]
"references.precedents.cumcm" = ["index.json"]
"references.precedents.figure-cards" = ["*.md"]
"references.precedents.mcm-icm" = ["index.json"]
"references.precedents.pattern-cards" = ["*.md"]
"references.research" = ["*.md"]
"references.review" = ["*.md"]
"references.safety" = ["*.md"]
"references.submission" = ["*.md"]
"references.validation" = ["*.md"]
"references.validation.profiles" = ["*.md"]
"references.visualization" = ["*.md"]
"references.workflow" = ["*.md"]
"references.writing" = ["*.md"]
"assets.drawio.archetypes" = ["README.md"]
"assets.drawio.archetypes.computational_pipeline" = ["*.drawio", "*.json", "*.md"]
"assets.drawio.archetypes.iterative_optimization" = ["*.drawio", "*.json", "*.md"]
"assets.drawio.archetypes.method_architecture" = ["*.drawio", "*.json", "*.md"]
"assets.drawio.archetypes.parallel_integration" = ["*.drawio", "*.json", "*.md"]
"assets.drawio.archetypes.research_framework" = ["*.drawio", "*.json", "*.md"]
"assets.pptx_workflow" = ["README.md", "*.pptx"]
"assets.styles" = ["*.json", "*.mplstyle"]
"assets.templates.cumcm-2026-electronic" = ["*.json", "*.tex"]
"assets.templates.mcm-icm-2026" = ["*.json", "*.tex"]
