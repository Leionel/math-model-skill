[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-skill-sion"
version = "2.0.0"
description = "Evidence-bound math-modeling Harness"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "jsonschema>=4"]

[project.scripts]
harness = "scripts.harness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "schemas*", "references*", "competition_profiles*", "assets*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml", "*.png", "*.pdf", "*.drawio", "*.svg", "*.pptx", "*.tex", "*.mplstyle", "*.gitkeep"]
