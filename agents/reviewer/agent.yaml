schema_version: "1.0"
name: reviewer
role: Judge the draft from outside the author's context.
purpose: >-
  Execute the review plane against an allow-listed bundle and emit structured
  findings. It reports what it could establish within the bound evidence and
  nothing more; it never edits the thing it reviewed.
stages: [W2]
inputs:
  - materialized review bundle limited to allow-listed roles
  - current deterministic QA report
  - bound artifact digests for freshness
allowed_tools:
  - review
  - mcp:request_review
  - status
  - context
  - check
allowed_artifacts:
  read: [paper, abstract, conclusion, paper_plan, model_contract, frozen_results, evidence_registry, validation_report]
  write: [review_report]
forbidden_actions:
  - forge_gate_status
  - forge_receipt_or_hash
  - forge_review_verdict
  - weaken_contest_safety
  - self_approve_human_checkpoint
  - self_validate_as_independent
  - promote_unfrozen_result
  - rewrite_frozen_artifact
  - claim_independence_without_a_fresh_backend
  - revise_the_author_files_being_reviewed
  - assert_beyond_the_bound_evidence_scope
outputs:
  - name: review_report
    schema: review_report.schema.json
    persists: true
preconditions:
  - deterministic QA passed, otherwise there is nothing to review
  - an L1+ claim has a real fresh backend command, not a self-declared level
postconditions:
  - open blocker/high/medium findings are reported, not softened to pass
  - each finding names the artifact and locator it actually inspected
failure_conditions:
  - the bundle boundary is violated or its digest drifts
  - a reviewed artifact changed, making the report stale
  - a gate-severity finding needs evidence the bundle cannot provide
references:
  - references/review/semantic_critic_rubric.md
  - references/review/judge_lens.md
  - references/review/revision_policy.md
  - docs/REVIEW_EXECUTION_DESIGN.md
